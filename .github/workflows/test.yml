name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit & Component Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Vitest suite
        run: npm test

  e2e:
    name: E2E Tests (Playwright – Chromium)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: placeholder-for-build

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          # Playwright starts its own dev server via webServer config,
          # but the build step already validated the app compiles.
          GOOGLE_GENERATIVE_AI_API_KEY: placeholder-for-ci
          CI: true
